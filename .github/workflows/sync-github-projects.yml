name: Sync GitHub projects

on:
  schedule:
    # Todo dia as 06:00 UTC (03:00 BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar snapshot do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs

      - name: Commitar se houver mudanca
        run: |
          if git diff --quiet -- src/data/github-snapshot.json; then
            echo "Snapshot sem alteracoes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-snapshot.json
          git commit -m "chore: sync github projects snapshot"
          git push
